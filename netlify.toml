[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/tickets"
  to = "/tickets.html"
  status = 200
  force = true

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200
  force = true

[[headers]]
  for = "/tickets"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/tickets.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
